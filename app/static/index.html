<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FinApp — daily budget</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Telegram Mini App bridge; harmless no-op in a normal browser -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">

    <!-- No period yet -->
    <section id="empty-state" class="card hidden">
      <h1 class="muted">Set a budget to start</h1>
    </section>

    <!-- Today's allowance -->
    <section id="today" class="hidden">
      <p class="label">You can spend today</p>
      <p id="per-day" class="allowance">0</p>
      <p id="over-note" class="over-note hidden">Now spending the overall budget</p>
      <div id="rebase" class="rebase hidden">
        <p id="next-daily" class="rebase-value"></p>
        <p class="rebase-caption">new daily budget · was <span id="was-daily"></span></p>
      </div>
      <p id="preview" class="preview hidden">
        <span id="preview-label">after this purchase:</span> <span id="preview-value"></span>
      </p>
      <p class="meta">
        <span id="remaining"></span> left · <span id="days-left"></span>
      </p>
    </section>

    <!-- Add operation (expense or income) -->
    <section id="spend" class="card hidden">
      <form id="operation-form" autocomplete="off">
        <div id="kind-toggle" class="segmented" role="group" aria-label="Operation type">
          <button type="button" class="seg active" data-kind="expense" aria-pressed="true">Expense</button>
          <button type="button" class="seg" data-kind="income" aria-pressed="false">Income</button>
        </div>
        <div class="row">
          <input id="operation-amount" type="text" inputmode="decimal"
                 placeholder="0.00" aria-label="Amount" required>
          <button id="operation-submit" type="submit" class="accent">Spent</button>
        </div>
        <input id="operation-comment" type="text" maxlength="200"
               placeholder="Comment (optional)" aria-label="Comment">
      </form>
      <button id="undo" type="button" class="undo hidden"></button>
    </section>

    <!-- Operation list -->
    <section id="history" class="hidden">
      <h2 class="label">Expenses</h2>
      <ul id="operation-list"></ul>
    </section>

    <!-- Period settings -->
    <section class="card">
      <details id="settings">
        <summary>Budget settings</summary>
        <form id="period-form" autocomplete="off">
          <label>Amount
            <input id="period-amount" type="text" inputmode="decimal"
                   placeholder="30000" required>
          </label>
          <div class="row">
            <label>From
              <input id="period-start" type="date" required>
            </label>
            <label>To
              <input id="period-end" type="date" required>
            </label>
          </div>
          <button type="submit" class="accent">Set budget</button>
          <p class="hint">Setting a new budget replaces the current one and its expenses.</p>
        </form>
      </details>
    </section>

    <p class="footer">
      <a id="download" href="/export.xlsx" download>Download .xlsx</a>
    </p>

  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
