<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinApp v2</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section id="auth-card" class="card auth-card">
      <p class="eyebrow">FinApp v2</p>
      <h1>Your money, in one place.</h1>
      <form id="auth-form">
        <label>Username<input id="username" autocomplete="username" required minlength="3"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="10"></label>
        <label id="display-field" class="hidden">Display name<input id="display-name" autocomplete="name"></label>
        <div class="actions">
          <button id="submit-auth" type="submit">Log in</button>
          <button id="toggle-auth" type="button" class="secondary">Create account</button>
        </div>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-shell" class="hidden">
      <header>
        <div><p class="eyebrow">FinApp v2</p><h1 id="workspace-name">Finances</h1></div>
        <button id="logout" class="secondary">Log out</button>
      </header>
      <nav aria-label="Primary">
        <button class="active">Accounts</button><button disabled>Transactions</button>
        <button disabled>Tracker</button><button disabled>Plan</button><button disabled>Analytics</button>
      </nav>
      <section class="card">
        <p class="muted">Foundation ready</p>
        <h2 id="welcome">Welcome</h2>
        <p>Accounts and transactions arrive in the next phase.</p>
        <div id="asset-list" class="chips"></div>
      </section>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
