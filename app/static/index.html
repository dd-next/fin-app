<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tzlvt — daily budget</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Telegram Mini App bridge; harmless no-op in a normal browser -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">

    <!-- No period yet -->
    <section id="empty-state" class="card hidden">
      <h1 class="muted">Set a budget to start</h1>
    </section>

    <!-- Today's allowance -->
    <section id="today" class="hidden">
      <p class="label">You can spend today</p>
      <p id="per-day" class="allowance">0</p>
      <p id="preview" class="preview hidden">
        after this purchase: <span id="preview-value"></span>
      </p>
      <p class="meta">
        <span id="remaining"></span> left · <span id="days-left"></span>
      </p>
    </section>

    <!-- Add expense -->
    <section id="spend" class="card hidden">
      <form id="expense-form" autocomplete="off">
        <div class="row">
          <input id="expense-amount" type="text" inputmode="decimal"
                 placeholder="0.00" aria-label="Expense amount" required>
          <button type="submit" class="accent">Spent</button>
        </div>
        <input id="expense-comment" type="text" maxlength="200"
               placeholder="Comment (optional)" aria-label="Comment">
      </form>
    </section>

    <!-- Expense list -->
    <section id="history" class="hidden">
      <h2 class="label">Expenses</h2>
      <ul id="expense-list"></ul>
    </section>

    <!-- Period settings -->
    <section class="card">
      <details id="settings">
        <summary>Budget settings</summary>
        <form id="period-form" autocomplete="off">
          <label>Amount
            <input id="period-amount" type="text" inputmode="decimal"
                   placeholder="30000" required>
          </label>
          <div class="row">
            <label>From
              <input id="period-start" type="date" required>
            </label>
            <label>To
              <input id="period-end" type="date" required>
            </label>
          </div>
          <button type="submit" class="accent">Set budget</button>
          <p class="hint">Setting a new budget replaces the current one and its expenses.</p>
        </form>
      </details>
    </section>

    <p class="footer">
      <a id="download" href="/export.xlsx" download>Download .xlsx</a>
    </p>

  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
